<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// Per-triangle area, face normal, centroid and a crease score (max dihedral angle
// to a neighbour). Density weighting is applied by *sampling probability*:
// triangle weight = area * score, so creased/silhouette triangles get up to 3x the
// points for the same surface. That is ART_DIRECTION's "edges 3x interior", done
// exactly instead of approximately.
function analyse(geo) {
  const pos = geo.attributes.position, idx = geo.index;
  const tri = idx ? idx.count / 3 : Math.floor(pos.count / 3);
  const get = (i) => (idx ? idx.getX(i) : i);
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();
  const area = new Float32Array(tri), nrm = new Float32Array(tri * 3), cent = new Float32Array(tri * 3);
  const edges = new Map();
  for (let t = 0; t < tri; t++) {
    const i0 = get(t * 3), i1 = get(t * 3 + 1), i2 = get(t * 3 + 2);
    A.fromBufferAttribute(pos, i0); B.fromBufferAttribute(pos, i1); C.fromBufferAttribute(pos, i2);
    ab.subVectors(B, A); ac.subVectors(C, A); cr.crossVectors(ab, ac);
    area[t] = cr.length() * 0.5;
    cr.normalize();
    nrm[t * 3] = cr.x; nrm[t * 3 + 1] = cr.y; nrm[t * 3 + 2] = cr.z;
    cent[t * 3] = (A.x + B.x + C.x) / 3; cent[t * 3 + 1] = (A.y + B.y + C.y) / 3; cent[t * 3 + 2] = (A.z + B.z + C.z) / 3;
    for (const [p, q] of [[i0, i1], [i1, i2], [i2, i0]]) {
      const k = p < q ? p + '_' + q : q + '_' + p;
      if (!edges.has(k)) edges.set(k, []);
      edges.get(k).push(t);
    }
  }
  const score = new Float32Array(tri).fill(1);
  for (const list of edges.values()) {
    if (list.length !== 2) continue;
    const [i, j] = list;
    const dot = nrm[i * 3] * nrm[j * 3] + nrm[i * 3 + 1] * nrm[j * 3 + 1] + nrm[i * 3 + 2] * nrm[j * 3 + 2];
    const ang = Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI;
    const boost = Math.min(3, 1 + ang / 22);
    if (boost > score[i]) score[i] = boost;
    if (boost > score[j]) score[j] = boost;
  }
  return { tri, area, nrm, cent, score };
}

// Bake frame 0 of a named clip onto the rig so a static point cloud is sampled from a
// natural idle/work pose instead of the bind-pose T (D6). Never animated at runtime.
function poseAsset(gltf, clipName) {
  if (!clipName) return false;
  const clip = THREE.AnimationClip.findByName(gltf.animations || [], clipName);
  if (!clip) return false;
  const mixer = new THREE.AnimationMixer(gltf.scene);
  const action = mixer.clipAction(clip);
  action.play();
  mixer.update(0);
  gltf.scene.updateWorldMatrix(true, true);
  gltf.scene.traverse((o) => { if (o.isSkinnedMesh) o.skeleton.update(); });
  return true;
}

// Posed vertex positions for a SkinnedMesh (bind-pose attributes are not the pose).
function posedPositions(mesh) {
  const n = mesh.geometry.attributes.position.count;
  const out = new Float32Array(n * 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    v.set(0, 0, 0);
    mesh.applyBoneTransform(i, v);
    out[i * 3] = v.x; out[i * 3 + 1] = v.y; out[i * 3 + 2] = v.z;
  }
  return out;
}

// Area*crease weighted triangle sampler. Deterministic in the injected PRNG.
function sampleMesh(geo, take, rnd, P, N, D, partId, base, posSrc) {
  const { tri, area, nrm, score } = analyse(geo);
  const pos = geo.attributes.position, idx = geo.index;
  const get = (i) => (idx ? idx.getX(i) : i);
  const cdf = new Float64Array(tri);
  let sum = 0;
  for (let t = 0; t < tri; t++) { sum += Math.max(1e-9, area[t]) * score[t]; cdf[t] = sum; }
  if (sum <= 0) return 0;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  let n = 0;
  for (let i = 0; i < take; i++) {
    const r = rnd() * sum;
    let lo = 0, hi = tri - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cdf[mid] < r) lo = mid + 1; else hi = mid; }
    const t = lo;
    if (posSrc) {
      const i0 = get(t * 3) * 3, i1 = get(t * 3 + 1) * 3, i2 = get(t * 3 + 2) * 3;
      A.set(posSrc[i0], posSrc[i0 + 1], posSrc[i0 + 2]);
      B.set(posSrc[i1], posSrc[i1 + 1], posSrc[i1 + 2]);
      C.set(posSrc[i2], posSrc[i2 + 1], posSrc[i2 + 2]);
    } else {
      A.fromBufferAttribute(pos, get(t * 3)); B.fromBufferAttribute(pos, get(t * 3 + 1)); C.fromBufferAttribute(pos, get(t * 3 + 2));
    }
    const u = Math.sqrt(rnd()), v = rnd();
    const w = base + n;
    P[w * 3] = (1 - u) * A.x + u * (1 - v) * B.x + u * v * C.x;
    P[w * 3 + 1] = (1 - u) * A.y + u * (1 - v) * B.y + u * v * C.y;
    P[w * 3 + 2] = (1 - u) * A.z + u * (1 - v) * B.z + u * v * C.z;
    N[w * 3] = nrm[t * 3]; N[w * 3 + 1] = nrm[t * 3 + 1]; N[w * 3 + 2] = nrm[t * 3 + 2];
    // density in 0..1: crease weight, plus a static scan dropout (never animated)
    D[w] = rnd() < 0.07 ? 0.25 : Math.min(1, Math.max(0.18, score[t] / 3));
    partId[w] = 0;
    n++;
  }
  return n;
}

const gltfCache = new Map();
async function loadScene(url) {
  if (!gltfCache.has(url)) gltfCache.set(url, await new GLTFLoader().loadAsync(url));
  return gltfCache.get(url);
}

function bboxOf(obj) {
  obj.updateWorldMatrix(true, true);
  const box = new THREE.Box3();
  obj.traverse((o) => {
    if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    const g = o.geometry;
    if (o.isSkinnedMesh) {
      const pp = posedPositions(o);
      for (let i = 0; i < pp.length; i += 3) box.expandByPoint(new THREE.Vector3(pp[i], pp[i + 1], pp[i + 2]).applyMatrix4(o.matrixWorld));
    } else {
      const p = g.attributes.position;
      for (let i = 0; i < p.count; i++) box.expandByPoint(new THREE.Vector3(p.getX(i), p.getY(i), p.getZ(i)).applyMatrix4(o.matrixWorld));
    }
  });
  return box;
}

// A part's transform is *metric*: the asset is scaled so its own height equals
// heightMeters, its base sits on pos.y and its footprint centre on pos.x/z.
// There is NO global fit rescale any more: that is what made a 1.7 m human and a
// 0.75 m desk resolve into a 4:1 mismatch.
function partMatrix(part) {
  const rotY = part.rotY || 0;
  return { rotY };
}

window.measureScene = async ({ parts }) => window.__lastMeasure || { footprint: 0.2, area: 1, spanX: 3, spanY: 2 };

window.sampleScene = async ({ parts, count, seed, ground }) => {
  const rnd = mulberry32((seed >>> 0) || 1337);
  const P = new Float32Array(count * 3), N = new Float32Array(count * 3), D = new Float32Array(count), PART = new Uint8Array(count);
  let w = 0;
  const totalWeight = parts.reduce((s, p) => s + (p.weight || 1), 0);
  const instances = [];
  for (let pi = 0; pi < parts.length; pi++) {
    const part = parts[pi];
    const gltf = await loadScene(part.url);
    poseAsset(gltf, part.poseClip);
    const src = gltf.scene.clone(true);
    const rotY = part.rotY || 0;
    // Native bbox measured AFTER the yaw, because the centring translation below is
    // applied inside the rotated frame. Measuring before the yaw mirrored every 180°
    // asset (the hero ended up at -pos) — the bug that put the character behind the desk.
    const probe = new THREE.Object3D();
    probe.rotation.y = rotY;
    probe.add(src);
    probe.updateWorldMatrix(true, true);
    const nb = bboxOf(src);
    const natH = Math.max(1e-6, nb.max.y - nb.min.y);
    const s = part.heightMeters ? part.heightMeters / natH : (part.scale || 1);
    const cx = (nb.min.x + nb.max.x) / 2, cz = (nb.min.z + nb.max.z) / 2;
    const target = part.pos || [0, 0, 0];
    probe.remove(src);
    const M = new THREE.Matrix4()
      .makeTranslation(target[0], target[1] || 0, target[2])
      .multiply(new THREE.Matrix4().makeRotationY(rotY))
      .multiply(new THREE.Matrix4().makeScale(s, s, s))
      .multiply(new THREE.Matrix4().makeTranslation(-cx, -nb.min.y, -cz));
    src.applyMatrix4(M);
    src.updateWorldMatrix(true, true);

    const meshes = [];
    src.traverse((o) => { if (o.isMesh && o.geometry && o.geometry.attributes.position) meshes.push(o); });
    if (!meshes.length) throw new Error('no mesh in ' + part.url);
    const share = pi === parts.length - 1 ? count - w : Math.max(1, Math.round(((part.weight || 1) / totalWeight) * count));
    const take = Math.min(share, count - w);
    if (take <= 0) continue;
    const areas = meshes.map((mesh) => {
      const posed = mesh.isSkinnedMesh ? posedPositions(mesh) : null;
      const g = mesh.geometry.clone(); g.applyMatrix4(mesh.matrixWorld);
      const p = g.attributes.position, idx = g.index;
      const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();
      const get = (i) => (idx ? idx.getX(i) : i);
      let area = 0;
      for (let t = 0; t < (idx ? idx.count / 3 : Math.floor(p.count / 3)); t++) {
        a.fromBufferAttribute(p, get(t * 3)); b.fromBufferAttribute(p, get(t * 3 + 1)); c.fromBufferAttribute(p, get(t * 3 + 2));
        ab.subVectors(b, a); ac.subVectors(c, a); area += cr.crossVectors(ab, ac).length() * 0.5;
      }
      return { g, area, posed };
    });
    const areaSum = areas.reduce((x, y) => x + y.area, 0) || 1;
    const start = w;
    let taken = 0;
    for (let mi = 0; mi < areas.length; mi++) {
      const mTake = mi === areas.length - 1 ? take - taken : Math.round((areas[mi].area / areaSum) * take);
      if (mTake <= 0) continue;
      const before = w;
      // skinned meshes sample from posed local space, then the part matrix is applied
      const posSrc = areas[mi].posed;
      if (posSrc) {
        const tmp = new Float32Array(mTake * 3), tn = new Float32Array(mTake * 3), td = new Float32Array(mTake), tp = new Uint8Array(mTake);
        sampleMesh(areas[mi].g, mTake, rnd, tmp, tn, td, tp, 0, posSrc);
        const v = new THREE.Vector3();
        for (let q = 0; q < mTake; q++) {
          v.set(tmp[q * 3], tmp[q * 3 + 1], tmp[q * 3 + 2]).applyMatrix4(src.matrixWorld);
          P[(w + q) * 3] = v.x; P[(w + q) * 3 + 1] = v.y; P[(w + q) * 3 + 2] = v.z;
          N[(w + q) * 3] = tn[q * 3]; N[(w + q) * 3 + 1] = tn[q * 3 + 1]; N[(w + q) * 3 + 2] = tn[q * 3 + 2];
          D[(w + q)] = td[q];
          PART[(w + q)] = pi;
        }
        w += mTake;
      } else {
        w += sampleMesh(areas[mi].g, mTake, rnd, P, N, D, PART, w);
      }
      for (let k = before; k < w; k++) PART[k] = pi;
      taken += w - before;
      areas[mi].g.dispose();
    }
    const wb = bboxOf(src);
    instances.push({
      assetId: part.id || part.url.split('/').pop().replace('.glb', ''),
      role: part.role || 'mid',
      ground: !!part.ground,
      bboxMeters: { min: wb.min.toArray(), max: wb.max.toArray(), size: wb.getSize(new THREE.Vector3()).toArray() },
      from: start, to: w,
    });
  }

  // Scene centre in XZ, used only for the ground radial fade.
  let gMinX = Infinity, gMaxX = -Infinity, gMinZ = Infinity, gMaxZ = -Infinity;
  for (let i = 0; i < w; i++) { const x = P[i * 3], z = P[i * 3 + 2]; if (x < gMinX) gMinX = x; if (x > gMaxX) gMaxX = x; if (z < gMinZ) gMinZ = z; if (z > gMaxZ) gMaxZ = z; }
  const gcx = (gMinX + gMaxX) / 2, gcz = (gMinZ + gMaxZ) / 2;
  const gR = Math.max(0.6, Math.min(gMaxX - gMinX, gMaxZ - gMinZ) * 0.62);
  for (const inst of instances) {
    if (!inst.ground) continue;
    for (let i = inst.from; i < inst.to; i++) {
      const dx = P[i * 3] - gcx, dz = P[i * 3 + 2] - gcz;
      const r = Math.hypot(dx, dz) / gR;
      // fade to zero well before any straight tile edge would be reachable
      const f = r >= 1 ? 0 : 1 - r * r * (3 - 2 * r);
      D[i] *= f;
    }
  }

  // Drop points whose density fell to nothing (ground rim), then compact.
  let m = 0;
  const outP = new Float32Array(w * 3), outN = new Float32Array(w * 3), outD = new Float32Array(w), outPart = new Uint8Array(w);
  for (let i = 0; i < w; i++) {
    if (D[i] < 0.02) continue;
    outP[m * 3] = P[i * 3]; outP[m * 3 + 1] = P[i * 3 + 1]; outP[m * 3 + 2] = P[i * 3 + 2];
    outN[m * 3] = N[i * 3]; outN[m * 3 + 1] = N[i * 3 + 1]; outN[m * 3 + 2] = N[i * 3 + 2];
    outD[m] = D[i]; outPart[m] = PART[i];
    m++;
  }
  return { count: m, positions: Array.from(outP.subarray(0, m * 3)), normals: Array.from(outN.subarray(0, m * 3)), density: Array.from(outD.subarray(0, m)), part: Array.from(outPart.subarray(0, m)), instances };
};

window.sampleGltf = async ({ url, count, seed }) => {
  const rnd = mulberry32(seed >>> 0);
  const gltf = await new GLTFLoader().loadAsync(url);
  const meshes = [];
  gltf.scene.updateWorldMatrix(true, true);
  gltf.scene.traverse((o) => { if (o.isMesh && o.geometry && o.geometry.attributes.position) meshes.push(o); });
  if (!meshes.length) throw new Error('no mesh in ' + url);
  const P = new Float32Array(count * 3), N = new Float32Array(count * 3), D = new Float32Array(count), PART = new Uint8Array(count);
  let w = 0;
  for (let mi = 0; mi < meshes.length; mi++) {
    const take = mi === meshes.length - 1 ? count - w : Math.round(count / meshes.length);
    const g = meshes[mi].geometry.clone(); g.applyMatrix4(meshes[mi].matrixWorld);
    w += sampleMesh(g, take, rnd, P, N, D, PART, w);
    g.dispose();
  }
  return { count: w, positions: Array.from(P.subarray(0, w * 3)), normals: Array.from(N.subarray(0, w * 3)), density: Array.from(D.subarray(0, w)) };
};
window.__samplerReady = true;
</script>
