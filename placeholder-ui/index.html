<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TokenDeck placeholder</title><style>body{font:15px system-ui;background:#111;color:#eee;margin:2rem}pre{background:#222;padding:1rem;overflow:auto}.ok{color:#7fda89}.bad{color:#ff8a8a}</style><h1>TokenDeck</h1><p id="health">Checking API…</p><pre id="status">Loading…</pre><script>const base=location.origin;async function load(){try{const h=await fetch(base+'/healthz');document.querySelector('#health').textContent=h.ok?'API healthy':'API unavailable';document.querySelector('#health').className=h.ok?'ok':'bad';document.querySelector('#status').textContent=JSON.stringify(await h.json(),null,2)}catch(e){document.querySelector('#health').textContent='API unavailable';document.querySelector('#health').className='bad'}}load()</script>
