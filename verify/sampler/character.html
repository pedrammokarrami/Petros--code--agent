<!doctype html><meta charset="utf-8"><title>skinned character sampler</title>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
// Offline: a rigged GLB becomes (a) rest-pose points with per-point skinIndex /
// skinWeight and (b) a skeleton + clip JSON. The runtime never loads a GLB.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const cache = new Map();
async function load(url) {
  if (!cache.has(url)) cache.set(url, await new GLTFLoader().loadAsync(url));
  return cache.get(url);
}

// Barycentric coordinates of p on triangle abc (Ericson, Real-Time Collision Detection).
function bary(p, a, b, c) {
  const v0x = b.x - a.x, v0y = b.y - a.y, v0z = b.z - a.z;
  const v1x = c.x - a.x, v1y = c.y - a.y, v1z = c.z - a.z;
  const v2x = p.x - a.x, v2y = p.y - a.y, v2z = p.z - a.z;
  const d00 = v0x * v0x + v0y * v0y + v0z * v0z;
  const d01 = v0x * v1x + v0y * v1y + v0z * v1z;
  const d11 = v1x * v1x + v1y * v1y + v1z * v1z;
  const d20 = v2x * v0x + v2y * v0y + v2z * v0z;
  const d21 = v2x * v1x + v2y * v1y + v2z * v1z;
  const den = d00 * d11 - d01 * d01 || 1e-12;
  const v = (d11 * d20 - d01 * d21) / den;
  const w = (d00 * d21 - d01 * d20) / den;
  return [1 - v - w, v, w];
}

function skeletonJSON(mesh) {
  const sk = mesh.skeleton;
  const bones = sk.bones;
  const index = new Map(bones.map((b, i) => [b, i]));
  return {
    bones: bones.map((b) => ({
      name: b.name,
      parent: b.parent && index.has(b.parent) ? index.get(b.parent) : -1,
      position: b.position.toArray(),
      quaternion: b.quaternion.toArray(),
      scale: b.scale.toArray(),
    })),
    boneInverses: sk.boneInverses.map((m) => m.elements.slice()),
  };
}

function clipsJSON(gltf, names) {
  const want = new Set(names);
  return gltf.animations
    .filter((c) => want.has(c.name))
    .map((c) => ({
      name: c.name,
      duration: c.duration,
      tracks: c.tracks.map((t) => ({
        name: t.name,
        type: t.constructor.name, // QuaternionKeyframeTrack | VectorKeyframeTrack
        times: Array.from(t.times),
        values: Array.from(t.values),
      })),
    }));
}

window.__samplerReady = true;

window.sampleCharacter = async ({ parts, count, seed, rig, clip, clips }) => {
  const rnd = mulberry32((seed >>> 0) || 777);
  const samplerRandom = () => rnd();
  let skeleton = null;
  let bonesOrder = null;
  const P = [], N = [], D = [], SI = [], SW = [];
  const totalWeight = parts.reduce((s, p) => s + (p.weight || 1), 0);
  let written = 0;

  for (let pi = 0; pi < parts.length; pi++) {
    const part = parts[pi];
    const gltf = await load(part.url);
    const root = gltf.scene.clone(true);
    if (part.pos || part.scale || part.rotY) {
      const m = new THREE.Matrix4()
        .makeTranslation(...(part.pos || [0, 0, 0]))
        .multiply(new THREE.Matrix4().makeRotationY(part.rotY || 0))
        .multiply(new THREE.Matrix4().makeScale(...(part.scale || [1, 1, 1])));
      root.applyMatrix4(m);
    }
    root.updateWorldMatrix(true, true);

    const meshes = [];
    root.traverse((o) => { if (o.isSkinnedMesh && o.geometry) meshes.push(o); });
    if (!meshes.length) throw new Error('no skinned mesh in ' + part.url);
    if (!skeleton) {
      skeleton = skeletonJSON(meshes[0]);
      bonesOrder = meshes[0].skeleton.bones.map((b) => b.name);
    }

    const share = pi === parts.length - 1 ? count - written : Math.max(1, Math.round(((part.weight || 1) / totalWeight) * count));
    const take = Math.min(share, count - written);
    let got = 0;

    for (const mesh of meshes) {
      if (got >= take) break;
      const geo = mesh.geometry;
      const pos = geo.attributes.position, nor = geo.attributes.normal;
      const ji = geo.attributes.skinIndex, wi = geo.attributes.skinWeight;
      if (!ji || !wi) throw new Error('mesh without skin attributes in ' + part.url);
      const sampler = new MeshSurfaceSampler(mesh).build();
      sampler.randomFunction = samplerRandom;
      const idx = geo.index;
      const triCount = idx ? idx.count / 3 : pos.count / 3;
      const mine = pi === parts.length - 1 ? take - got : Math.max(1, Math.round(take / meshes.length));
      const p = new THREE.Vector3(), nn = new THREE.Vector3();
      const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();

      for (let k = 0; k < mine && got < take; k++, got++) {
        // _sampleFaceIndex/_sampleFace are the documented internals sample() calls;
        // going through them is the only way to learn WHICH triangle the point hit.
        const face = sampler._sampleFaceIndex();
        sampler._sampleFace(face, p, nn);
        const i0 = idx ? idx.getX(face * 3) : face * 3;
        const i1 = idx ? idx.getX(face * 3 + 1) : face * 3 + 1;
        const i2 = idx ? idx.getX(face * 3 + 2) : face * 3 + 2;
        a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2);
        const bary3 = bary(p, a, b, c);

        // Accumulate per-bone weight over the triangle's three vertices, weighted by
        // the barycentric coordinate of the sample.
        const acc = new Map();
        for (const [vi, w] of [[i0, bary3[0]], [i1, bary3[1]], [i2, bary3[2]]]) {
          for (let s = 0; s < 4; s++) {
            const ww = wi.getComponent(vi, s) * w;
            if (ww <= 1e-6) continue;
            const bone = Math.round(ji.getComponent(vi, s));
            acc.set(bone, (acc.get(bone) || 0) + ww);
          }
        }
        const top = [...acc.entries()].sort((x, y) => y[1] - x[1]).slice(0, 4);
        const sum = top.reduce((s, e) => s + e[1], 0) || 1;
        while (top.length < 4) top.push([0, 0]);

        P.push(p.x, p.y, p.z);
        N.push(nn.x, nn.y, nn.z);
        D.push(1);
        SI.push(top[0][0], top[1][0], top[2][0], top[3][0]);
        SW.push(top[0][1] / sum, top[1][1] / sum, top[2][1] / sum, top[3][1] / sum);
        written++;
      }
    }
  }

  const rigFile = await load(rig);
  return {
    count: written,
    positions: P, normals: N, density: D,
    skinIndex: SI, skinWeight: SW,
    skeleton,
    boneOrder: bonesOrder,
    clips: clipsJSON(rigFile, [clip]),
  };
};
</script>
